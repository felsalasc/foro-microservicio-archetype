#set( $dollar = '$' )
spring.application.name=${artifactId}
spring.profiles.default=local
server.port=${dollar}{PORT:${port}}
spring.jpa.open-in-view=false
usuarios.base-url=${dollar}{USUARIOS_BASE_URL:http://localhost:8081}
usuarios.connect-timeout=${dollar}{USUARIOS_CONNECT_TIMEOUT:2s}
usuarios.read-timeout=${dollar}{USUARIOS_READ_TIMEOUT:3s}
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.deserialization.fail-on-numbers-for-enums=true
spring.jackson.mapper.allow-coercion-of-scalars=false
